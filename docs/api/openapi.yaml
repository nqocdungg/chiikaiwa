openapi: 3.1.0

info:
  title: Chiikaiwa API
  version: 0.1.0
  description: >-
    Contract máy đọc được cho API Chiikaiwa. Phạm vi ban đầu bao phủ health
    check và BE-009; xem docs/api/README.md trước khi thêm endpoint.

servers:
  - url: /api/v1
    description: Cùng origin với ứng dụng

tags:
  - name: Auth
  - name: Sessions
  - name: System
  - name: Profile
  - name: Invitations
  - name: Invitation Requests
  - name: Content Admin
  - name: Learning Content
  - name: Flashcards
  - name: Quizzes
  - name: Safety
  - name: Admin Operations

paths:
  /sessions/{id}:
    get:
      tags:
        - Sessions
      operationId: getSession
      summary: ??c phi?n theo quy?n th?nh vi?n
      description: Reconcile deadline tr??c projection. GET kh?ng c?ng d?n
        clock/counter v?o database. Disconnect d?ng clock; ph?c h?i ??y ?? thu?c
        task ti?p theo.
      security:
        - sessionCookie: []
        - guestCookie: []
      parameters:
        - &a2
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Session hi?n h?nh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/RequestError'
        '401':
          $ref: '#/components/responses/RequestError'
        '403':
          $ref: '#/components/responses/RequestError'
        '404':
          $ref: '#/components/responses/RequestError'
        '410':
          $ref: '#/components/responses/RequestError'
        '503':
          $ref: '#/components/responses/RequestError'
  /sessions/{id}/leave:
    post:
      tags:
        - Sessions
      operationId: leaveSession
      summary: K?t th?c phi?n cho c? hai th?nh vi?n
      description:
        Body r?ng, kh?ng expectedVersion. Retry kh?ng k?t th?c l?n hai ho?c
        gia h?n kh?ch. Commit ended tr??c thu h?i media; l?i d?ch v? gi? cleanup
        pending, response v?n l? Session ended.
      security: &a3
        - sessionCookie: []
          csrfToken: []
        - guestCookie: []
          csrfToken: []
      parameters:
        - *a2
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: &a4
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        '200':
          description: Session ended; media c? th? ?ang retry thu h?i
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/RequestError'
        '401':
          $ref: '#/components/responses/RequestError'
        '403':
          $ref: '#/components/responses/RequestError'
        '404':
          $ref: '#/components/responses/RequestError'
        '409':
          $ref: '#/components/responses/RequestError'
        '410':
          $ref: '#/components/responses/RequestError'
        '413':
          $ref: '#/components/responses/RequestError'
        '415':
          $ref: '#/components/responses/RequestError'
        '422':
          $ref: '#/components/responses/RequestError'
        '429':
          $ref: '#/components/responses/RequestError'
        '503':
          $ref: '#/components/responses/RequestError'
  /sessions/{id}/media-token:
    post:
      tags:
        - Sessions
      operationId: issueSessionMediaToken
      summary: C?p token ??ng room v? identity c?a th?nh vi?n
      description:
        TTL t?i ?a 10 ph?t, kh?ng v??t deadline quy?n. Ki?m tra l?i sau k?;
        kh?ng cache token trong receipt. Ended t? ch?i SESSION_ENDED.
      security: *a3
      parameters:
        - *a2
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: *a4
      responses:
        '200':
          description: Credential ch? d?ng v?i SDK media
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                additionalProperties: false
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - url
                      - token
                      - expiresAt
                    properties:
                      url:
                        type: string
                      token:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/RequestError'
        '401':
          $ref: '#/components/responses/RequestError'
        '403':
          $ref: '#/components/responses/RequestError'
        '404':
          $ref: '#/components/responses/RequestError'
        '409':
          $ref: '#/components/responses/RequestError'
        '410':
          $ref: '#/components/responses/RequestError'
        '413':
          $ref: '#/components/responses/RequestError'
        '415':
          $ref: '#/components/responses/RequestError'
        '422':
          $ref: '#/components/responses/RequestError'
        '429':
          $ref: '#/components/responses/RequestError'
        '503':
          $ref: '#/components/responses/RequestError'
  /sessions/{id}/deck-options:
    get:
      tags: [Sessions]
      operationId: listSessionDeckOptions
      summary: Liệt kê bộ chủ đề có thể chọn
      description: Chỉ thành viên của phiên chưa kết thúc được đọc danh sách.
      security:
        - sessionCookie: []
        - guestCookie: []
      parameters:
        - *a2
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: Danh sách bộ xuất bản và số tình huống của đúng revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDeckOptionsResponse'
        '400':
          $ref: '#/components/responses/RequestError'
        '401':
          $ref: '#/components/responses/RequestError'
        '403':
          $ref: '#/components/responses/RequestError'
        '404':
          $ref: '#/components/responses/RequestError'
        '409':
          description: Phiên đã kết thúc (SESSION_ENDED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          $ref: '#/components/responses/RequestError'
        '422':
          $ref: '#/components/responses/RequestError'
        '503':
          $ref: '#/components/responses/RequestError'

  /sessions/{id}/deck-selection:
    post:
      tags: [Sessions]
      operationId: selectSessionDeck
      summary: Chọn và trải một bộ chủ đề
      description: Trả 404 RESOURCE_NOT_FOUND nếu revision không thuộc bộ đang xuất bản hoặc không còn là revision được chọn mới.
      security: *a3
      parameters:
        - *a2
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectSessionDeckRequest'
      responses:
        '200':
          description: Trạng thái riêng của người gọi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/RequestError'
        '401':
          $ref: '#/components/responses/RequestError'
        '403':
          $ref: '#/components/responses/RequestError'
        '404':
          $ref: '#/components/responses/RequestError'
        '409':
          $ref: '#/components/responses/RequestError'
        '410':
          $ref: '#/components/responses/RequestError'
        '413':
          $ref: '#/components/responses/RequestError'
        '415':
          $ref: '#/components/responses/RequestError'
        '422':
          $ref: '#/components/responses/RequestError'
        '429':
          $ref: '#/components/responses/RequestError'
        '503':
          $ref: '#/components/responses/RequestError'

  /sessions/{id}/control/claim:
    post:
      tags: [Sessions]
      operationId: claimSessionControl
      summary: Lấy quyền điều khiển phiên
      security: *a3
      parameters:
        - *a2
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionVersionRequest'
      responses:
        '200':
          description: Trạng thái riêng của người gọi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/RequestError'
        '401':
          $ref: '#/components/responses/RequestError'
        '403':
          $ref: '#/components/responses/RequestError'
        '404':
          $ref: '#/components/responses/RequestError'
        '409':
          $ref: '#/components/responses/RequestError'
        '410':
          $ref: '#/components/responses/RequestError'
        '413':
          $ref: '#/components/responses/RequestError'
        '415':
          $ref: '#/components/responses/RequestError'
        '422':
          $ref: '#/components/responses/RequestError'
        '429':
          $ref: '#/components/responses/RequestError'
        '503':
          $ref: '#/components/responses/RequestError'

  /sessions/{id}/draws:
    post:
      tags: [Sessions]
      operationId: drawSessionCard
      summary: Bốc đúng lá ở slot được chọn
      security: *a3
      parameters:
        - *a2
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DrawSessionCardRequest'
      responses:
        '200':
          description: Trạng thái riêng của người gọi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/RequestError'
        '401':
          $ref: '#/components/responses/RequestError'
        '403':
          $ref: '#/components/responses/RequestError'
        '404':
          $ref: '#/components/responses/RequestError'
        '409':
          $ref: '#/components/responses/RequestError'
        '410':
          $ref: '#/components/responses/RequestError'
        '413':
          $ref: '#/components/responses/RequestError'
        '415':
          $ref: '#/components/responses/RequestError'
        '422':
          $ref: '#/components/responses/RequestError'
        '429':
          $ref: '#/components/responses/RequestError'
        '503':
          $ref: '#/components/responses/RequestError'

  /sessions/{id}/cards/{cardId}/hints:
    get:
      tags: [Sessions]
      operationId: getSessionCardHints
      summary: Đọc gợi ý của lá đã bốc
      security:
        - sessionCookie: []
        - guestCookie: []
      parameters:
        - *a2
        - name: cardId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ObjectId' }
      responses:
        '200':
          description: Gợi ý và kiến thức theo revision của lá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionHintsResponse'
        '400':
          $ref: '#/components/responses/RequestError'
        '401':
          $ref: '#/components/responses/RequestError'
        '403':
          $ref: '#/components/responses/RequestError'
        '404':
          $ref: '#/components/responses/RequestError'
        '410':
          $ref: '#/components/responses/RequestError'
        '422':
          $ref: '#/components/responses/RequestError'
        '503':
          $ref: '#/components/responses/RequestError'

  /sessions/{id}/actions:
    post:
      tags: [Sessions]
      operationId: proposeSessionCardAction
      summary: Gửi đề nghị đồng thuận cho lá hiện tại
      security: *a3
      parameters:
        - *a2
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeSessionCardActionRequest'
      responses:
        '201':
          description: Trạng thái riêng của người gọi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionActionResponse'
        '400':
          $ref: '#/components/responses/RequestError'
        '401':
          $ref: '#/components/responses/RequestError'
        '403':
          $ref: '#/components/responses/RequestError'
        '404':
          $ref: '#/components/responses/RequestError'
        '409':
          $ref: '#/components/responses/RequestError'
        '410':
          $ref: '#/components/responses/RequestError'
        '413':
          $ref: '#/components/responses/RequestError'
        '415':
          $ref: '#/components/responses/RequestError'
        '422':
          $ref: '#/components/responses/RequestError'
        '429':
          $ref: '#/components/responses/RequestError'
        '503':
          $ref: '#/components/responses/RequestError'

  /sessions/{id}/actions/{actionId}/responses:
    post:
      tags: [Sessions]
      operationId: respondToSessionCardAction
      summary: Phản hồi đề nghị của đối tác
      security: *a3
      parameters:
        - *a2
        - name: actionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespondToSessionCardActionRequest'
      responses:
        '200':
          description: Trạng thái riêng của người gọi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/RequestError'
        '401':
          $ref: '#/components/responses/RequestError'
        '403':
          $ref: '#/components/responses/RequestError'
        '404':
          $ref: '#/components/responses/RequestError'
        '409':
          $ref: '#/components/responses/RequestError'
        '410':
          $ref: '#/components/responses/RequestError'
        '413':
          $ref: '#/components/responses/RequestError'
        '415':
          $ref: '#/components/responses/RequestError'
        '422':
          $ref: '#/components/responses/RequestError'
        '429':
          $ref: '#/components/responses/RequestError'
        '503':
          $ref: '#/components/responses/RequestError'

  /webhooks/livekit:
    post:
      tags: [System]
      operationId: receiveLivekitWebhook
      summary: Xác minh webhook LiveKit và cập nhật hiện diện
      description: >-
        Server-to-server; không dùng cookie, CSRF hoặc Idempotency-Key.
        Xác minh Authorization và hash của raw body bằng SDK LiveKit trước khi ghi.
        Receipt eventId được giữ 7 ngày; SID, thời điểm và trạng thái vẫn bảo vệ
        sau khi receipt bị dọn. Receipt, presence và consumer vòng đời dùng cùng
        transaction. Sự kiện participant/room_finished của phiên đã biết trả 503
        nếu chưa nối consumer BE-012; không ghi receipt thành công giả.
        Không suy ra presence hoặc bắt đầu phiên từ room_started.
        Khi đủ hai thành viên trở lại trước hạn phục hồi, chuyển reconnecting
        về active sau khi kiểm tra quyền; giữ controller, bộ/thẻ/vai và phần
        thời gian chọn bộ còn lại, không tăng lại số phiên đã bắt đầu.
      security:
        - livekitWebhookSignature: []
      requestBody:
        required: true
        content:
          application/webhook+json:
            schema:
              type: object
              required: [id, event, createdAt]
              properties:
                id:
                  type: string
                  format: uuid
                event:
                  type: string
                createdAt:
                  type: [string, integer]
                  description: UNIX timestamp theo giây; SDK giải mã thành int64
                room:
                  type: object
                  properties:
                    name:
                      type: string
                    sid:
                      type: string
                  additionalProperties: true
                participant:
                  type: object
                  properties:
                    identity:
                      type: string
                    sid:
                      type: string
                  additionalProperties: true
              additionalProperties: true
      responses:
        '204':
          description: Đã xử lý, bỏ qua an toàn hoặc eventId đã xử lý; không có body
        '401':
          description: WEBHOOK_UNAUTHORIZED — thiếu/sai chữ ký, hash hoặc payload không giải mã được
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: PAYLOAD_TOO_LARGE — raw body vượt 1 MiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: UNSUPPORTED_MEDIA_TYPE — sai Content-Type hoặc body nén
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SERVICE_UNAVAILABLE — cấu hình, dữ liệu, đối soát hoặc consumer chưa sẵn sàng; retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Kiểm tra trạng thái API và database
      responses:
        '200':
          description: Dịch vụ sẵn sàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Database chưa sẵn sàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /invitations:
    post:
      tags: [Invitations]
      operationId: createInvitation
      summary: Tạo mã mời có hạn 10 phút
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
            example: {}
      responses:
        '201':
          description: Invitation đã được tạo; chỉ host nhận code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    get:
      tags: [Invitations]
      operationId: getInvitation
      summary: Đọc invitation trong phạm vi host hoặc requester liên quan
      security:
        - sessionCookie: []
        - guestCookie: []
      responses:
        '200':
          description: Invitation hiện tại; code chỉ xuất hiện với host khi còn open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Invitations]
      operationId: cancelInvitation
      summary: Host hủy invitation
      security:
        - sessionCookie: []
          csrfToken: []
