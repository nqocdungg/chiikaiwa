            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Trang request theo thứ tự mới nhất
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteRequestListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /invitation-requests:
    post:
      tags: [Invitation Requests]
      operationId: createInvitationRequest
      summary: Người học gửi request bằng mã mời
      description: Checks two-way pair blocks in the transaction before reserving the requester or reopening a request; returns 409 PAIR_BLOCKED for a blocked pair.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
                  pattern: '^[A-HJ-NP-Z2-9]{10}$'
            example:
              code: ABCD234567
      responses:
        '201':
          description: Request đã được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /invitation-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Invitation Requests]
      operationId: getInvitationRequest
      summary: Host hoặc requester đọc invitation request
      security:
        - sessionCookie: []
        - guestCookie: []
      responses:
        '200':
          description: Invitation request hiện tại
          content:
            application/json:
              schema:
