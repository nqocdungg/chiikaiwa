openapi: 3.1.0

info:
  title: Chiikaiwa API
  version: 0.1.0
  description: >-
    Contract máy đọc được cho API Chiikaiwa. Phạm vi ban đầu bao phủ health
    check và BE-009; xem docs/api/README.md trước khi thêm endpoint.

servers:
  - url: /api/v1
    description: Cùng origin với ứng dụng

tags:
  - name: Sessions
  - name: System
  - name: Invitations
  - name: Invitation Requests
  - name: Content Admin
  - name: Learning Content

paths:
  /sessions/{id}:
    get:
      tags:
        - Sessions
      operationId: getSession
      summary: ??c phi?n theo quy?n th?nh vi?n
      description: Reconcile deadline tr??c projection. GET kh?ng c?ng d?n
        clock/counter v?o database. Disconnect d?ng clock; ph?c h?i ??y ?? thu?c
        task ti?p theo.
      security:
        - sessionCookie: []
        - guestCookie: []
      parameters:
        - &a2
          name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Session hi?n h?nh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400': &a1
          description: L?i theo ErrorResponse v? API specification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': *a1
        '403': *a1
        '404': *a1
        '410': *a1
        '503': *a1
  /sessions/{id}/leave:
    post:
      tags:
        - Sessions
      operationId: leaveSession
      summary: K?t th?c phi?n cho c? hai th?nh vi?n
      description:
        Body r?ng, kh?ng expectedVersion. Retry kh?ng k?t th?c l?n hai ho?c
        gia h?n kh?ch. Commit ended tr??c thu h?i media; l?i d?ch v? gi? cleanup
        pending, response v?n l? Session ended.
      security: &a3
        - sessionCookie: []
          csrfToken: []
        - guestCookie: []
          csrfToken: []
      parameters:
        - *a2
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: &a4
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        '200':
          description: Session ended; media c? th? ?ang retry thu h?i
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400': *a1
        '401': *a1
        '403': *a1
        '404': *a1
        '409': *a1
        '410': *a1
        '413': *a1
        '415': *a1
        '422': *a1
        '429': *a1
        '503': *a1
  /sessions/{id}/media-token:
    post:
      tags:
        - Sessions
      operationId: issueSessionMediaToken
      summary: C?p token ??ng room v? identity c?a th?nh vi?n
      description:
        TTL t?i ?a 10 ph?t, kh?ng v??t deadline quy?n. Ki?m tra l?i sau k?;
        kh?ng cache token trong receipt. Ended t? ch?i SESSION_ENDED.
      security: *a3
      parameters:
        - *a2
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: *a4
      responses:
        '200':
          description: Credential ch? d?ng v?i SDK media
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                additionalProperties: false
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - url
                      - token
                      - expiresAt
                    properties:
                      url:
                        type: string
                      token:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': *a1
        '401': *a1
        '403': *a1
        '404': *a1
        '409': *a1
        '410': *a1
        '413': *a1
        '415': *a1
        '422': *a1
        '429': *a1
        '503': *a1
  /webhooks/livekit:
    post:
      tags: [System]
      operationId: receiveLivekitWebhook
      summary: Xác minh webhook LiveKit và cập nhật hiện diện
      description: >-
        Server-to-server; không dùng cookie, CSRF hoặc Idempotency-Key.
        Xác minh Authorization và hash của raw body bằng SDK LiveKit trước khi ghi.
        Receipt eventId được giữ 7 ngày; SID, thời điểm và trạng thái vẫn bảo vệ
        sau khi receipt bị dọn. Receipt, presence và consumer vòng đời dùng cùng
        transaction. Sự kiện participant/room_finished của phiên đã biết trả 503
        nếu chưa nối consumer BE-012; không ghi receipt thành công giả.
        Không suy ra presence hoặc bắt đầu phiên từ room_started.
      security:
        - livekitWebhookSignature: []
      requestBody:
        required: true
        content:
          application/webhook+json:
            schema:
              type: object
              required: [id, event, createdAt]
              properties:
                id:
                  type: string
                  format: uuid
                event:
                  type: string
                createdAt:
                  type: [string, integer]
                  description: UNIX timestamp theo giây; SDK giải mã thành int64
                room:
                  type: object
                  properties:
                    name:
                      type: string
                    sid:
                      type: string
                  additionalProperties: true
                participant:
                  type: object
                  properties:
                    identity:
                      type: string
                    sid:
                      type: string
                  additionalProperties: true
              additionalProperties: true
      responses:
        '204':
          description: Đã xử lý, bỏ qua an toàn hoặc eventId đã xử lý; không có body
        '401':
          description: WEBHOOK_UNAUTHORIZED — thiếu/sai chữ ký, hash hoặc payload không giải mã được
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: PAYLOAD_TOO_LARGE — raw body vượt 1 MiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: UNSUPPORTED_MEDIA_TYPE — sai Content-Type hoặc body nén
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SERVICE_UNAVAILABLE — cấu hình, dữ liệu, đối soát hoặc consumer chưa sẵn sàng; retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Kiểm tra trạng thái API và database
      responses:
        '200':
          description: Dịch vụ sẵn sàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Database chưa sẵn sàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /invitations:
    post:
      tags: [Invitations]
      operationId: createInvitation
      summary: Tạo mã mời có hạn 10 phút
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
            example: {}
      responses:
        '201':
          description: Invitation đã được tạo; chỉ host nhận code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    get:
      tags: [Invitations]
      operationId: getInvitation
      summary: Đọc invitation trong phạm vi host hoặc requester liên quan
      security:
        - sessionCookie: []
        - guestCookie: []
      responses:
        '200':
          description: Invitation hiện tại; code chỉ xuất hiện với host khi còn open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Invitations]
      operationId: cancelInvitation
      summary: Host hủy invitation
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Invitation đã được hủy
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /invitations/{invitationId}/requests:
    get:
      tags: [Invitation Requests]
      operationId: listInvitationRequests
      summary: Host liệt kê request của invitation
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/InvitationId'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InviteRequestStatus'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Trang request theo thứ tự mới nhất
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteRequestListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /invitation-requests:
    post:
      tags: [Invitation Requests]
      operationId: createInvitationRequest
      summary: Người học gửi request bằng mã mời
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
                  pattern: '^[A-HJ-NP-Z2-9]{10}$'
            example:
              code: ABCD234567
      responses:
        '201':
          description: Request đã được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /invitation-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Invitation Requests]
      operationId: getInvitationRequest
      summary: Host hoặc requester đọc invitation request
      security:
        - sessionCookie: []
        - guestCookie: []
      responses:
        '200':
          description: Invitation request hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Invitation Requests]
      operationId: cancelInvitationRequest
      summary: Requester hủy request đang chờ
      security:
        - sessionCookie: []
          csrfToken: []
        - guestCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Request đã được hủy
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /invitation-requests/{requestId}/responses:
    post:
      tags: [Invitation Requests]
      operationId: respondToInvitationRequest
      summary: Host chấp nhận hoặc từ chối request
      description: >-
        Accept fail-closed với SERVICE_UNAVAILABLE cho tới khi pair-safety guard
        của BE-008 được nối vào ứng dụng.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, decision]
              properties:
                expectedVersion:
                  type: integer
                  minimum: 0
                decision:
                  type: string
                  enum: [accept, reject]
            example:
              expectedVersion: 0
              decision: accept
      responses:
        '200':
          description: Request sau quyết định của host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/content/{id}/publish:
    post:
      tags: [Content Admin]
      operationId: publishContentItem
      summary: Xuất bản revision bất biến cho học liệu (BE-013, 07 §10)
      description: >-
        Tạo một content_versions mới bất biến, khử trùng lặp các ID tham chiếu và
        cập nhật con trỏ publishedVersionId trong cùng MongoDB transaction.
        Nếu thiếu references hoặc không đạt ngưỡng tối thiểu sẽ trả lỗi 422 CONTENT_INCOMPLETE.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion:
                  type: integer
                  minimum: 0
            example:
              expectedVersion: 0
      responses:
        '200':
          description: Bản ghi học liệu sau khi xuất bản
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ContentIncomplete'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/content/{id}/hide:
    post:
      tags: [Content Admin]
      operationId: hideContentItem
      summary: Ẩn học liệu nhưng giữ nguyên revision tham chiếu (BE-013, 07 §10)
      description: >-
        Chuyển trạng thái sang hidden, bảo toàn publishedVersionId để các phiên,
        lượt quiz hoặc mục đã lưu trước đó không bị gãy liên kết.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion:
                  type: integer
                  minimum: 0
            example:
              expectedVersion: 1
      responses:
        '200':
          description: Bản ghi học liệu sau khi ẩn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /topics:
    get:
      tags: [Learning Content]
      operationId: listPublishedTopics
      summary: Lấy danh sách bộ chủ đề đã xuất bản dành cho Learner (07 §7)
      description: >-
        Chỉ trả các bộ deck có status là published. Dùng phân trang keyset cursor.
        Tuyệt đối không chứa roleA, roleB hay đáp án ngân hàng.
      security:
        - sessionCookie: []
      parameters:
        - name: level
          in: query
          schema:
            type: string
            enum: [N5, N4, N3, N2, N1]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Danh sách tóm tắt các bộ chủ đề đã xuất bản
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicListResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /topic-versions/{id}:
    get:
      tags: [Learning Content]
      operationId: getTopicVersionDetail
      summary: Lấy chi tiết phiên bản bộ chủ đề dành cho Learner hoặc Guest (07 §7)
      description: >-
        Trả thông tin metadata, số lượng kịch bản và câu hỏi của đúng phiên bản bộ.
        Không chứa nội dung kịch bản hay đáp án.
      security:
        - sessionCookie: []
        - guestCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Chi tiết phiên bản bộ chủ đề
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicVersionDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /topic-versions/{id}/knowledge:
    get:
      tags: [Learning Content]
      operationId: getTopicVersionKnowledge
      summary: Lấy danh sách kiến thức của đúng bản nguồn chủ đề (07 §7)
      description: >-
        Trả danh sách KnowledgeItem của đúng bản nguồn chủ đề, phục vụ người học
        xem học liệu mà không cần tham gia cuộc gọi trước (FR-LRN-01).
      security:
        - sessionCookie: []
        - guestCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Danh sách kiến thức thuộc phiên bản chủ đề
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeListResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /knowledge/{id}:
    get:
      tags: [Learning Content]
      operationId: getKnowledgeDetail
      summary: Lấy chi tiết mục kiến thức (07 §7)
      description: >-
        Nếu có versionId thì lấy đúng bản lịch sử đã lưu; nếu không có thì lấy bản
        xuất bản mới nhất. Tuyệt đối không trả roleA, roleB hay đáp án ngân hàng.
      security:
        - sessionCookie: []
        - guestCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - name: versionId
          in: query
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Chi tiết mục kiến thức
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    livekitWebhookSignature:
      type: apiKey
      in: header
      name: Authorization
      description: JWT do LiveKit ký có hash raw body; dùng nguyên giá trị header của LiveKit
    sessionCookie:
      type: apiKey
      in: cookie
      name: ck_session
      description: Cookie phiên tài khoản do server cấp
    guestCookie:
      type: apiKey
      in: cookie
      name: ck_guest
      description: Cookie phiên khách do server cấp
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Phải khớp cookie CSRF và Origin được phép

  parameters:
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    ExpectedVersion:
      name: expectedVersion
      in: query
      required: true
      schema:
        type: integer
        minimum: 0
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Session:
      type: object
      required:
        - id
        - status
        - version
        - members
        - activeDurationMs
        - selectionRemainingMs
        - slots
        - screenShare
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        status:
          type: string
          enum:
            - preparing
            - active
            - reconnecting
            - ended
        version: &a2
          type: integer
          minimum: 0
        controllerKey: &a3
          type: string
        members:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/Partner'
        startedAt: &a1
          type: string
          format: date-time
        endedAt: *a1
        endReason:
          type: string
          enum:
            - left
            - connection_timeout
            - selection_timeout
            - blocked
            - account_locked
            - system_error
        suggestedMinutes:
          type: integer
          enum:
            - 10
            - 20
            - 30
        activeDurationMs: *a2
        selectionRemainingMs: *a2
        reconnectUntil: *a1
        deckVersionId:
          $ref: '#/components/schemas/ObjectId'
        slots:
          type: array
          items:
            $ref: '#/components/schemas/SessionSlot'
        currentCard:
          $ref: '#/components/schemas/SessionCurrentCard'
        pendingAction:
          $ref: '#/components/schemas/SessionPendingAction'
        screenShare:
          $ref: '#/components/schemas/SessionScreenShare'
      additionalProperties: false
    SessionSlot:
      type: object
      required:
        - slot
        - status
      properties:
        slot: *a2
        status:
          type: string
          enum:
            - faceDown
            - current
            - completed
            - skipped
            - unfinished
      additionalProperties: false
    SessionCurrentCard:
      type: object
      required:
        - id
        - scenarioVersionId
        - title
        - context
        - objective
        - myRole
        - status
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        scenarioVersionId:
          $ref: '#/components/schemas/ObjectId'
        title: *a3
        context: *a3
        objective: *a3
        myRole: *a3
        status: *a3
      additionalProperties: false
    SessionPendingAction:
      type: object
      required:
        - id
        - kind
        - cardId
        - proposedBy
        - proposedAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - swapRoles
            - skip
            - completeAndNext
        cardId:
          $ref: '#/components/schemas/ObjectId'
        proposedBy: *a3
        proposedAt: *a1
      additionalProperties: false
    SessionScreenShare:
      type: object
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - idle
            - granting
            - active
            - revoking
        ownerKey: *a3
      additionalProperties: false
    SessionResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/Session'
        meta:
          $ref: '#/components/schemas/Meta'
      additionalProperties: false
    ObjectId:
      type: string
      pattern: '^[0-9a-fA-F]{24}$'
      example: 507f1f77bcf86cd799439011
    InvitationStatus:
      type: string
      enum: [open, used, cancelled, expired]
    InviteRequestStatus:
      type: string
      enum: [pending, accepted, rejected, cancelled, expired]
    Meta:
      type: object
      required: [requestId, serverTime]
      properties:
        requestId:
          type: string
          format: uuid
        serverTime:
          type: string
          format: date-time
      additionalProperties: true
    Partner:
      type: object
      required: [actorKey, displayName]
      properties:
        actorKey:
          type: string
        displayName:
          type: string
        avatarKey:
          type: string
        profile:
          type: object
          additionalProperties: true
      additionalProperties: false
    Invitation:
      type: object
      required: [id, status, version, expiresAt]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        code:
          type: string
          pattern: '^[A-HJ-NP-Z2-9]{10}$'
          description: Chỉ trả cho host khi invitation còn open
        status:
          $ref: '#/components/schemas/InvitationStatus'
        version:
          type: integer
          minimum: 0
        expiresAt:
          type: string
          format: date-time
        sessionId:
          $ref: '#/components/schemas/ObjectId'
      additionalProperties: false
    InviteRequest:
      type: object
      required: [id, invitationId, requester, status, version, expiresAt]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        invitationId:
          $ref: '#/components/schemas/ObjectId'
        requester:
          $ref: '#/components/schemas/Partner'
        status:
          $ref: '#/components/schemas/InviteRequestStatus'
        version:
          type: integer
          minimum: 0
        expiresAt:
          type: string
          format: date-time
        sessionId:
          $ref: '#/components/schemas/ObjectId'
      additionalProperties: false
    InvitationResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Invitation'
        meta:
          $ref: '#/components/schemas/Meta'
      additionalProperties: false
    InviteRequestResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/InviteRequest'
        meta:
          $ref: '#/components/schemas/Meta'
      additionalProperties: false
    InviteRequestList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InviteRequest'
        nextCursor:
          type: string
      additionalProperties: false
    InviteRequestListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/InviteRequestList'
        meta:
          $ref: '#/components/schemas/Meta'
      additionalProperties: false
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
      additionalProperties: false
    HealthResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Health'
        meta:
          $ref: '#/components/schemas/Meta'
      additionalProperties: false
    ContentItem:
      type: object
      required: [id, kind, status, latestRevision, version]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        kind:
          type: string
          enum: [deck, scenario, knowledge, question]
        status:
          type: string
          enum: [draft, published, hidden]
        latestRevision:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 0
        publishedVersionId:
          $ref: '#/components/schemas/ObjectId'
        draftPayload:
          type: object
        level:
          type: string
          enum: [N5, N4, N3, N2, N1]
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    ContentItemResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ContentItem'
        meta:
          $ref: '#/components/schemas/Meta'
      additionalProperties: false
    TopicSummary:
      type: object
      required: [id, versionId, title, level, description]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        versionId:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
        level:
          type: string
          enum: [N5, N4, N3, N2, N1]
        description:
          type: string
      additionalProperties: false
    TopicListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TopicSummary'
        meta:
          $ref: '#/components/schemas/Meta'
      additionalProperties: false
    TopicVersionDetail:
      type: object
      required:
        [
          id,
          contentId,
          title,
          level,
          description,
          knowledgeCount,
          questionCount,
        ]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        contentId:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
        level:
          type: string
          enum: [N5, N4, N3, N2, N1]
        description:
          type: string
        knowledgeCount:
          type: integer
          minimum: 0
        questionCount:
          type: integer
          minimum: 0
      additionalProperties: false
    TopicVersionDetailResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/TopicVersionDetail'
        meta:
          $ref: '#/components/schemas/Meta'
      additionalProperties: false
    KnowledgeExample:
      type: object
      required: [japanese, vietnamese]
      properties:
        japanese:
          type: string
        vietnamese:
          type: string
      additionalProperties: false
    KnowledgeItem:
      type: object
      required: [id, versionId, type, expression, meaning, examples]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        versionId:
          $ref: '#/components/schemas/ObjectId'
        type:
          type: string
          enum: [vocabulary, grammar]
        expression:
          type: string
        reading:
          type: string
        meaning:
          type: string
        examples:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeExample'
      additionalProperties: false
    KnowledgeListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeItem'
        meta:
          $ref: '#/components/schemas/Meta'
      additionalProperties: false
    KnowledgeDetailResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/KnowledgeItem'
        meta:
          $ref: '#/components/schemas/Meta'
      additionalProperties: false
    FieldError:
      type: object
      required: [path, code, message]
      properties:
        path:
          type: string
        code:
          type: string
        message:
          type: string
      additionalProperties: false
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          properties:
            fields:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
          additionalProperties: true
      additionalProperties: false
    ErrorResponse:
      type: object
      required: [error, meta]
      properties:
        error:
          $ref: '#/components/schemas/Error'
        meta:
          $ref: '#/components/schemas/Meta'
      additionalProperties: false

  responses:
    Unauthorized:
      description: Thiếu hoặc không còn phiên xác thực hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Tài nguyên không tồn tại hoặc ngoài phạm vi truy cập
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Version conflict, actor busy hoặc invitation không khả dụng
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: Request không đạt validation contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ContentIncomplete:
      description: Học liệu thiếu references hoặc không đạt ngưỡng tối thiểu trước khi xuất bản (422)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Vượt giới hạn request; xem header Retry-After
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Dependency an toàn chưa sẵn sàng; không tạo session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
