      operationId: getSessionSummary
      summary: Đọc tổng kết phiên đã bắt đầu và kết thúc
      description: Chỉ ghép dữ liệu cá nhân, nguồn đã lưu và quiz của người gọi; không trả dữ liệu riêng của đối tác.
      security: *personalReadSecurity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Tổng kết dựng từ snapshot phiên và dữ liệu riêng của người gọi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSummaryResponse'
        '400':
          $ref: '#/components/responses/RequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'

  /me/sessions:
    get:
      tags: [Sessions]
      operationId: listMySessions
      summary: Liệt kê lịch sử phiên đã bắt đầu của tài khoản
      description: Không đưa phòng chờ/chưa bắt đầu, vai, gợi ý hoặc dữ liệu cá nhân của đối tác vào danh sách.
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: Lịch sử theo startedAt và ID giảm dần
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionHistoryResponse'
        '400':
          $ref: '#/components/responses/RequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/saved-items:
    get:
      tags: [Learning Content]
      operationId: listSavedItems
      summary: Liệt kê mục đã lưu của người gọi
      description: Với khách, nội dung dùng revision mới nhất có nguồn đã lưu trong bộ của lượt thử.
      security: &savedReadSecurity
        - sessionCookie: []
        - guestCookie: []
      parameters:
        - name: sessionId
          in: query
          description: Chỉ lấy các mục có nguồn thuộc phiên này
          schema:
            $ref: '#/components/schemas/ObjectId'
        - &savedLimit
          name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - &savedCursor
          name: cursor
          in: query
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: Mục đang được lưu, theo ngày lưu và ID giảm dần
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedItemsResponse'
        '400': &savedBadRequest
          description: MALFORMED_REQUEST hoặc INVALID_CURSOR
          content: &savedError
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': &savedUnauthorized
          $ref: '#/components/responses/Unauthorized'
        '403': &savedForbidden
          description: ACCOUNT_LOCKED hoặc CSRF_INVALID khi ghi
          content: *savedError
        '404': &savedNotFound
          $ref: '#/components/responses/NotFound'
        '410': &savedExpired
          description: GUEST_EXPIRED
          content: *savedError
        '422': &savedInvalid
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Learning Content]
      operationId: saveKnowledgeItem
      summary: Lưu kiến thức và nguồn
      description: >-
        Dùng chung một mục cho mỗi kiến thức. Khi lưu từ phiên, phải gửi cả sessionId và
        scenarioVersionId của lá đã bốc. Với khách, phản hồi dùng revision mới nhất có nguồn
        đã lưu trong bộ của lượt thử, kể cả khi gửi lại cùng yêu cầu.
      security: &savedWriteSecurity
        - sessionCookie: []
          csrfToken: []
        - guestCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [knowledgeVersionId, deckVersionId]
              dependentRequired:
                sessionId: [scenarioVersionId]
                scenarioVersionId: [sessionId]
              properties:
                knowledgeVersionId: &savedId
                  $ref: '#/components/schemas/ObjectId'
                deckVersionId: *savedId
                sessionId: *savedId
                scenarioVersionId: *savedId
      responses:
        '200':
          description: Mục đã lưu và bản kiến thức hiện được phép xem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedItemResponse'
        '400': *savedBadRequest
        '401': *savedUnauthorized
        '403': *savedForbidden
        '404': *savedNotFound
        '409': &savedConflict
          $ref: '#/components/responses/Conflict'
        '410': *savedExpired
        '413':
          description: PAYLOAD_TOO_LARGE
          content: *savedError
        '415':
          description: UNSUPPORTED_MEDIA_TYPE
          content: *savedError
        '422': *savedInvalid
        '429': &savedRateLimited
          $ref: '#/components/responses/RateLimited'

  /me/saved-items/{id}:
    delete:
      tags: [Learning Content]
      operationId: removeSavedItem
      summary: Bỏ lưu kiến thức
      description: Đổi trạng thái lưu theo expectedVersion, giữ nguồn và tiến độ ôn.
      security: *savedWriteSecurity
      parameters:
        - &savedPathId
          name: id
          in: path
          required: true
          schema: *savedId
        - $ref: '#/components/parameters/ExpectedVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Đã bỏ lưu
        '400': *savedBadRequest
        '401': *savedUnauthorized
        '403': *savedForbidden
        '404': *savedNotFound
        '409': *savedConflict
        '410': *savedExpired
        '422': *savedInvalid
        '429': *savedRateLimited

  /me/saved-items/{id}/sources:
    get:
      tags: [Learning Content]
      operationId: listSavedItemSources
      summary: Đọc nguồn của mục đã lưu
      description: Chủ sở hữu vẫn xem được đúng revision nguồn sau khi bỏ lưu.
      security: *savedReadSecurity
      parameters:
        - *savedPathId
        - *savedLimit
        - *savedCursor
      responses:
        '200':
          description: Nguồn theo ngày tạo và ID giảm dần
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSourcesResponse'
        '400': *savedBadRequest
        '401': *savedUnauthorized
        '403': *savedForbidden
        '404': *savedNotFound
        '410': *savedExpired
        '422': *savedInvalid

  /me/profile:
    patch:
      tags: [Profile]
      operationId: updateMyProfile
      summary: Cập nhật hồ sơ người dùng hiện tại
      description: >-
        Cập nhật một phần hồ sơ theo cơ chế CAS (`expectedVersion`) và
        idempotency (`Idempotency-Key`). Các trường không gửi giữ nguyên; các
        trường tùy chọn trong `profile` gửi `null` để xóa. Header tùy chọn
        `X-Expected-Actor` gắn yêu cầu với tài khoản đã mở biểu mẫu; nếu khác
        phiên đăng nhập hiện tại sẽ trả `409 IDENTITY_CONFLICT` trước khi ghi.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatchRequest'
      responses:
        '200':
          description: Hồ sơ người dùng sau cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfResponse'
        '400':
          description: Yêu cầu không hợp lệ (MALFORMED_REQUEST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Thiếu/sai CSRF hoặc tài khoản bị khóa (CSRF_INVALID, ACCOUNT_LOCKED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Payload vượt giới hạn kích thước (PAYLOAD_TOO_LARGE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Định dạng nén không được hỗ trợ (UNSUPPORTED_MEDIA_TYPE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /study/cards/query:
    post:
      tags: [Flashcards]
      operationId: queryStudyCards
      summary: Truy vấn mặt hỏi và tiến độ ôn tập
      description: >-
        Chế độ due gồm thẻ mới và thẻ đến hạn tại giờ server. Sắp xếp theo ngày tạo mục kiến thức
        (topic), ngày lưu (saved) hoặc ngày thêm vào bộ (personalDeck), sau đó theo ID của bản ghi
        tương ứng, đều giảm dần. Cursor chỉ dùng lại cho cùng danh tính, phạm vi và chế độ.
        Với học liệu ẩn, trả bản xuất bản mới nhất mà người học có nguồn hợp lệ.
        Hai thao tác study/cards không cần Idempotency-Key.
      security: &studySecurity
        - sessionCookie: []
          csrfToken: []
        - guestCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scope, mode]
              properties:
                scope:
                  $ref: '#/components/schemas/StudyScope'
                mode:
                  enum: [all, due]
                limit:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 20
                cursor:
                  type: string
                  maxLength: 512
      responses:
        '200':
          description: Trang thẻ đã được kiểm tra quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyQueryResponse'
        '400':
          description: JSON lỗi hoặc INVALID_CURSOR
          content: &studyError
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': &studyUnauthorized
          $ref: '#/components/responses/Unauthorized'
        '403': &studyForbidden
          description: CSRF_INVALID hoặc ACCOUNT_LOCKED
          content: *studyError
        '404': &studyNotFound
          $ref: '#/components/responses/NotFound'
        '410': &studyGone
          description: GUEST_EXPIRED hoặc RESOURCE_DELETING
          content: *studyError
        '413': &studyTooLarge
          description: PAYLOAD_TOO_LARGE
          content: *studyError
        '415': &studyUnsupported
          description: UNSUPPORTED_MEDIA_TYPE
          content: *studyError
        '422': &studyInvalid
          $ref: '#/components/responses/ValidationFailed'
  /study/cards/reveal:
    post:
      tags: [Flashcards]
      operationId: revealStudyCard
      summary: Mở đáp án và nhận vé đánh giá
      description: Tính ba lịch dự kiến theo giờ server và cấp vé ký có hạn tối đa 30 phút, không vượt hạn quyền của khách. Không ghi tiến độ hay lượt ôn.
      security: *studySecurity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scope, cardKey]
              properties:
                scope:
                  $ref: '#/components/schemas/StudyScope'
                cardKey:
                  $ref: '#/components/schemas/StudyCardKey'
      responses:
        '200':
          description: Mặt hỏi, mặt đáp, tiến độ, preview và vé đánh giá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyRevealResponse'
        '400':
          description: JSON lỗi
          content: *studyError
        '401': *studyUnauthorized
        '403': *studyForbidden
        '404': *studyNotFound
        '410': *studyGone
        '413': *studyTooLarge
        '415': *studyUnsupported
        '422': *studyInvalid
        '503':
          description: Cấu hình lịch ôn chưa sẵn sàng
          content: *studyError

  /study/reviews:
    post:
      tags: [Flashcards]
      operationId: submitStudyReview
      summary: Ghi nhận một lượt ôn FSRS
      description: Tính lại lịch theo giờ server. Cùng Idempotency-Key và payload trả lượt đã ghi nếu người gọi còn quyền; không ghi thêm tiến độ, log hoặc thống kê.
      security: *studySecurity
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reviewTicket, rating]
              properties:
                reviewTicket: { type: string, minLength: 1, maxLength: 4096 }
                rating: &studyRating { type: integer, enum: [1, 2, 3] }
      responses:
        '201':
          description: Lượt ôn đã commit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyReviewResponse'
        '400':
          description: JSON lỗi
          content: *studyError
        '401': *studyUnauthorized
        '403': *studyForbidden
        '404': *studyNotFound
        '409':
          description: REVIEW_TICKET_EXPIRED, VERSION_CONFLICT hoặc IDEMPOTENCY_CONFLICT
          content: *studyError
        '410': *studyGone
        '413': *studyTooLarge
        '415': *studyUnsupported
        '422': *studyInvalid
        '429':
          description: Vượt giới hạn ghi
          content: *studyError
        '503':
          description: Cấu hình lịch ôn chưa sẵn sàng
          content: *studyError

  /me/reviews:
    get:
      tags: [Flashcards]
      operationId: listStudyReviews
      summary: Đọc lịch sử lượt ôn của người gọi theo thẻ
      security:
        - sessionCookie: []
        - guestCookie: []
      parameters:
        - name: cardKey
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/StudyCardKey'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: Lịch sử mới nhất trước, phân trang theo reviewedAt và id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyReviewHistoryResponse'
        '400':
          description: Limit hoặc cursor không hợp lệ
          content: *studyError
        '401': *studyUnauthorized
        '403': *studyForbidden
        '404': *studyNotFound
        '410': *studyGone
        '422': *studyInvalid

  /quizzes:
    post:
      tags: [Quizzes]
      operationId: createQuiz
      summary: Tạo lượt làm quiz
      description: |
        Tạo lượt quiz gồm tối đa 5 câu hỏi không trùng từ ngân hàng câu hỏi của bộ chủ đề.
        Gửi lại cùng khóa và nội dung trả cùng lượt ở dạng QuizPublic với trạng thái và version hiện tại.
        Đọc kết quả đã nộp qua GET /quizzes/{id}.
      security: *studySecurity
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuizRequest'
      responses:
        '201':
          description: Lượt quiz mới hoặc lượt đã tạo cho cùng yêu cầu
          headers:
            Location:
              description: URI của lượt quiz
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizPublicResponse'
        '400':
          description: Dữ liệu yêu cầu không hợp lệ
          content: *studyError
        '401': *studyUnauthorized
        '403': *studyForbidden
        '404': *studyNotFound
        '409':
          description: Ngân hàng không có câu hỏi khả dụng (QUIZ_UNAVAILABLE) hoặc Idempotency-Key đã dùng với nội dung khác (IDEMPOTENCY_CONFLICT)
          content: *studyError
        '410': *studyGone
        '413': *studyTooLarge
        '415': *studyUnsupported
        '422': *studyInvalid
        '429':
          $ref: '#/components/responses/RateLimited'

  /quizzes/{id}:
    get:
      tags: [Quizzes]
      operationId: getQuiz
      summary: Xem chi tiết lượt quiz
      description: Trả QuizPublic nếu đang làm, hoặc QuizResult nếu đã nộp.
      security:
        - sessionCookie: []
        - guestCookie: []
      parameters:
        - $ref: '#/components/parameters/QuizId'
      responses:
        '200':
          description: Chi tiết lượt quiz
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/QuizPublicResponse'
                  - $ref: '#/components/schemas/QuizResultResponse'
        '400':
          description: ID không hợp lệ (MALFORMED_REQUEST)
          content: *studyError
        '401': *studyUnauthorized
        '403': *studyForbidden
        '404': *studyNotFound
        '410': *studyGone

  /quizzes/{id}/submission:
    post:
      tags: [Quizzes]
      operationId: submitQuiz
      summary: Nộp bài chấm điểm quiz
      description: |
        Chấm điểm phía server, chuyển trạng thái sang submitted và lưu kết quả bất biến.
        Gửi lại cùng nội dung trả kết quả đã lưu. Dùng lại khóa với expectedVersion hoặc câu trả lời khác trả 409 IDEMPOTENCY_CONFLICT.
      security: *studySecurity
      parameters:
        - $ref: '#/components/parameters/QuizId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitQuizRequest'
      responses:
        '200':
          description: Kết quả chấm quiz
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResultResponse'
        '400':
          description: Dữ liệu yêu cầu không hợp lệ
          content: *studyError
        '401': *studyUnauthorized
        '403': *studyForbidden
        '404': *studyNotFound
        '409':
          description: Lượt quiz đã được nộp (QUIZ_ALREADY_SUBMITTED), Idempotency-Key đã dùng với nội dung khác (IDEMPOTENCY_CONFLICT), hoặc xung đột phiên bản (VERSION_CONFLICT)
          content: *studyError
        '410': *studyGone
        '413': *studyTooLarge
        '415': *studyUnsupported
        '422': *studyInvalid
        '429':
          $ref: '#/components/responses/RateLimited'

  /me/quizzes:
    get:
      tags: [Quizzes]
      operationId: listQuizzes
      summary: Lấy danh sách lịch sử quiz của người gọi
      description: Phân trang theo cursor và createdAt giảm dần.
      security:
        - sessionCookie: []
        - guestCookie: []
      parameters:
        - name: sourceSessionId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ObjectId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
      responses:
        '200':
          description: Danh sách quiz
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizListResponse'
        '400':
          description: Con trỏ giải mã thất bại (INVALID_CURSOR) hoặc sourceSessionId sai định dạng (MALFORMED_REQUEST)
          content: *studyError
        '401': *studyUnauthorized
        '403': *studyForbidden
        '410': *studyGone
        '422': *studyInvalid

  /me/blocks:
    get:
      tags: [Safety]
      operationId: listMyBlocks
      summary: Lấy danh sách các bản chặn do người gọi tạo (BE-019, 07 §10)
      description: >-
        Chỉ trả các bản chặn mà người gọi là blockerKey, sắp xếp theo createdAt giảm dần rồi _id giảm dần.
        Partner projection không bao gồm email hoặc dữ liệu riêng tư; khách được gắn nhãn "Khách".
      security:
        - sessionCookie: []
        - guestCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
      responses:
        '200':
          description: Danh sách bản chặn của người gọi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockListResponse'
        '400':
          description: Con trỏ phân trang không hợp lệ (INVALID_CURSOR)
          content: *studyError
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Safety]
      operationId: createBlock
      summary: Chặn đối tác từ một phiên đã tham gia (BE-019, 07 §10)
      description: >-
        Kiểm tra đúng hai thành viên của phiên, tạo bản chặn có hướng trong transaction TX-05,
        kết thúc phiên đang mở (nếu có) với lý do blocked và thu hồi điều phối/media liên quan.
        Gửi lại cùng Idempotency-Key và payload trả về cùng bản chặn; khác payload trả 409 IDEMPOTENCY_CONFLICT.
      security:
        - sessionCookie: []
          csrfToken: []
        - guestCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBlockRequest'
      responses:
        '200':
          description: Bản chặn đã được ghi nhận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBlockResponse'
        '400':
          description: Dữ liệu hoặc header Idempotency-Key không hợp lệ
          content: *studyError
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          description: Payload vượt quá 1 MiB (PAYLOAD_TOO_LARGE)
          content: *studyError
        '415':
          description: Thiếu Content-Type application/json (UNSUPPORTED_MEDIA_TYPE)
          content: *studyError
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /me/blocks/{id}:
    delete:
      tags: [Safety]
      operationId: deleteMyBlock
      summary: Gỡ một bản chặn do chính người gọi tạo (BE-019, 07 §10)
      description: >-
        Chỉ xóa bản chặn thuộc sở hữu của người gọi; không ảnh hưởng bản chặn chiều ngược lại từ đối tác.
        Bản chặn không tồn tại hoặc của người khác trả 404 RESOURCE_NOT_FOUND.
      security:
        - sessionCookie: []
          csrfToken: []
        - guestCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Đã gỡ bản chặn
        '400':
          description: ID bản chặn hoặc Idempotency-Key không hợp lệ
          content: *studyError
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'

  /reports:
    post:
      tags: [Safety]
      operationId: createReport
      summary: Gửi báo cáo đối tác gắn với một phiên đã tham gia (BE-019, 07 §10)
      description: >-
        Kiểm tra đúng hai thành viên của phiên, lưu báo cáo ở trạng thái new (không tự chặn, không kết thúc phiên,
        không đặt TTL). Hỗ trợ Idempotency-Key chống gửi lặp.
      security:
        - sessionCookie: []
          csrfToken: []
        - guestCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        '201':
          description: Báo cáo đã được tiếp nhận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReportResponse'
        '400':
          description: Dữ liệu hoặc header Idempotency-Key không hợp lệ
          content: *studyError
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          description: Payload vượt quá 1 MiB (PAYLOAD_TOO_LARGE)
          content: *studyError
        '415':
          description: Thiếu Content-Type application/json (UNSUPPORTED_MEDIA_TYPE)
          content: *studyError
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /admin/statistics:
    get:
      tags:
        - Admin Operations
      operationId: getAdminStatistics
      summary: Thống kê hoạt động tích lũy cho quản trị viên (07 §10, BE-034)
      description: >-
        Trả đúng bốn bộ đếm tổng hợp từ document lifetime. Từ chối truy cập
        ngoài Admin; không suy ra số liệu từ log có thể đã được xóa.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Bốn bộ đếm hoạt động tích lũy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStatisticsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/users:
    get:
      tags:
        - Admin Operations
      operationId: listAdminUsers
      summary: Danh sách tài khoản người dùng cho quản trị viên (07 §10, BE-026)
      description: >-
        Trả danh sách tài khoản người dùng kèm phân trang cursor keyset, hỗ trợ
        lọc theo trạng thái active hoặc locked.
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, locked]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
      responses:
        '200':
          description: Danh sách người dùng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponse'
        '400':
          description: Con trỏ giải mã thất bại (INVALID_CURSOR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/users/{id}/status:
    patch:
      tags:
        - Admin Operations
      operationId: updateAdminUserStatus
      summary: Khóa hoặc mở khóa tài khoản người dùng (07 §10, BE-026, TX-05)
      description: >-
        Cập nhật trạng thái tài khoản (active hoặc locked) với kiểm soát phiên bản
        CAS qua expectedVersion và cơ chế Idempotency-Key (retry cùng key trả trạng thái hiện hành).
        Không cho phép khóa tài khoản có vai trò admin.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserStatusRequest'
      responses:
        '200':
          description: Cập nhật trạng thái tài khoản thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserStatusResponse'
        '400':
          description: ID sai định dạng (MALFORMED_REQUEST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Payload vượt quá 1 MiB (PAYLOAD_TOO_LARGE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Không phải application/json (UNSUPPORTED_MEDIA_TYPE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/reports:
    get:
      tags:
        - Admin Operations
      operationId: listAdminReports
      summary: Danh sách báo cáo người dùng cho quản trị viên (07 §10, BE-026)
      description: >-
        Trả danh sách báo cáo vi phạm kèm phân trang cursor keyset, hỗ trợ lọc
        theo trạng thái báo cáo (new, inProgress, resolved, rejected).
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ReportStatus'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
      responses:
        '200':
          description: Danh sách báo cáo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportListResponse'
        '400':
          description: Con trỏ giải mã thất bại (INVALID_CURSOR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/reports/{id}:
    get:
      tags:
        - Admin Operations
      operationId: getAdminReport
      summary: Chi tiết một báo cáo vi phạm (07 §10, BE-026)
      description: Xem chi tiết báo cáo vi phạm theo ID.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Chi tiết báo cáo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '400':
          description: ID sai định dạng (MALFORMED_REQUEST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    patch:
      tags:
        - Admin Operations
      operationId: updateAdminReport
      summary: Xử lý trạng thái và kết quả báo cáo (07 §10, BE-026)
      description: >-
        Cập nhật trạng thái và kết quả xử lý của báo cáo với kiểm soát phiên bản
        CAS qua expectedVersion và Idempotency-Key (retry cùng key trả trạng thái hiện hành).
        Cho phép mở lại báo cáo (status new/inProgress sau resolved/rejected); khi chuyển về new,
        handledBy và handledAt được gỡ bỏ. Resolution chỉ thay đổi khi request gửi trường này;
        nếu bỏ trường, giá trị đã lưu được giữ nguyên. Khi status là new, resolution có thể là
        kết quả được lưu từ lần xử lý trước.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportUpdateRequest'
      responses:
        '200':
          description: Cập nhật báo cáo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '400':
          description: ID sai định dạng (MALFORMED_REQUEST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Payload vượt quá 1 MiB (PAYLOAD_TOO_LARGE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Không phải application/json (UNSUPPORTED_MEDIA_TYPE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    livekitWebhookSignature:
      type: apiKey
      in: header
      name: Authorization
      description: JWT do LiveKit ký có hash raw body; dùng nguyên giá trị header của LiveKit
    sessionCookie:
      type: apiKey
      in: cookie
      name: ck_session
      description: Cookie phiên tài khoản do server cấp
    guestCookie:
      type: apiKey
      in: cookie
      name: ck_guest
      description: Cookie phiên khách do server cấp
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Phải khớp cookie CSRF và Origin được phép

  parameters:
    QuizId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    ExpectedVersion:
      name: expectedVersion
      in: query
      required: true
      schema:
        type: integer
        minimum: 0
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    ExpectedActor:
      name: X-Expected-Actor
      in: header
      required: false
      description: >-
        Tùy chọn. Gắn yêu cầu ghi với tài khoản đã mở biểu mẫu, nhận ObjectId
        24 ký tự hex hoặc chuỗi dạng `user:<ObjectId>`. Khi bỏ qua, server xử lý
        theo phiên hiện tại. Khi được gửi (kể cả chuỗi rỗng) và khác
        `identity.userId` hoặc `identity.actorKey` của phiên hiện tại, server từ
        chối trước khi ghi với `409 IDENTITY_CONFLICT`.
      schema:
        type: string
        pattern: '^(user:)?[0-9a-fA-F]{24}$'

  schemas:
    SessionSelfAssessment:
      type: object
      additionalProperties: false
      required: [confidence]
      properties:
        confidence:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
    PersonalSession:
      type: object
      additionalProperties: false
      required: [sessionId, noteVersion, version]
      properties:
        sessionId:
          $ref: '#/components/schemas/ObjectId'
        note:
          type: string
          maxLength: 10000
        noteVersion:
          type: integer
          minimum: 0
        selfAssessment:
          $ref: '#/components/schemas/SessionSelfAssessment'
        version:
          type: integer
          minimum: 0
    PutSessionNoteRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, note]
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        note:
          type: string
          maxLength: 10000
    PutSessionSelfAssessmentRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, confidence]
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        confidence:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
    PersonalSessionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/PersonalSession'
        meta:
          $ref: '#/components/schemas/Meta'
    DrawnSessionCard:
      type: object
      additionalProperties: false
      required: [id, scenarioVersionId, title, status, drawnAt]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        scenarioVersionId:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
        status:
          type: string
          enum: [current, completed, skipped, unfinished]
        drawnAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    SessionSummary:
      type: object
      additionalProperties: false
      required: [session, drawnCards, personal, savedSources, quizAttempts]
      properties:
        session:
          $ref: '#/components/schemas/Session'
        drawnCards:
          type: array
          items:
            $ref: '#/components/schemas/DrawnSessionCard'
        personal:
          $ref: '#/components/schemas/PersonalSession'
        savedSources:
          type: array
          items:
            $ref: '#/components/schemas/SavedSource'
        quizAttempts:
          type: array
          items:
            $ref: '#/components/schemas/QuizSummaryItem'
    SessionSummaryResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/SessionSummary'
        meta:
          $ref: '#/components/schemas/Meta'
    SessionHistoryItem:
      type: object
      additionalProperties: false
      required: [id, status, members, startedAt, activeDurationMs]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        status:
          type: string
          enum: [preparing, active, reconnecting, ended]
        members:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/Partner'
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        endReason:
          type: string
          enum:
            [
              left,
              connection_timeout,
              selection_timeout,
              blocked,
              account_locked,
              system_error,
            ]
        suggestedMinutes:
          type: integer
          enum: [10, 20, 30]
        activeDurationMs:
          type: integer
          minimum: 0
        deckVersionId:
          $ref: '#/components/schemas/ObjectId'
    SessionHistoryResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, nextCursor]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SessionHistoryItem'
            nextCursor:
              type: [string, 'null']
        meta:
          $ref: '#/components/schemas/Meta'
    SavedItem:
      type: object
      additionalProperties: false
      required: [id, knowledge, savedAt, version]
      properties:
        id: *savedId
        knowledge:
          $ref: '#/components/schemas/KnowledgeItem'
        savedAt: &savedDate
          type: string
          format: date-time
        version: { type: integer, minimum: 0 }
    SavedSource:
      type: object
      additionalProperties: false
      required: [knowledgeVersionId, deckVersionId, createdAt]
      dependentRequired:
        sessionId: [scenarioVersionId]
        scenarioVersionId: [sessionId]
      properties:
        knowledgeVersionId: *savedId
        deckVersionId: *savedId
        sessionId: *savedId
        scenarioVersionId: *savedId
        createdAt: *savedDate
    SavedItemResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        meta: &savedMeta
          $ref: '#/components/schemas/Meta'
        data:
          $ref: '#/components/schemas/SavedItem'
    SavedItemsResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        meta: *savedMeta
        data:
          type: object
          additionalProperties: false
          required: [items, nextCursor]
          properties:
            nextCursor: &savedNext
              type: [string, 'null']
            items:
              type: array
              items:
                $ref: '#/components/schemas/SavedItem'
    SavedSourcesResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        meta: *savedMeta
        data:
          type: object
          additionalProperties: false
          required: [items, nextCursor]
          properties:
            nextCursor: *savedNext
            items:
              type: array
              items:
                $ref: '#/components/schemas/SavedSource'
    StudyScope:
      description: Khách chỉ dùng topic của lượt thử và saved tạm.
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, topicVersionId]
          properties:
            type: { const: topic }
            topicVersionId:
              $ref: '#/components/schemas/ObjectId'
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { const: saved }
        - type: object
          additionalProperties: false
          required: [type, deckId]
          properties:
            type: { const: personalDeck }
            deckId:
              $ref: '#/components/schemas/ObjectId'
    StudyCardKey:
      type: string
      pattern: '^(knowledge|manual):[a-f0-9]{24}$'
    StudyProgress:
      type: object
      additionalProperties: false
      required: [cardKey, state, reps, lapses, version]
      properties:
        cardKey:
          $ref: '#/components/schemas/StudyCardKey'
        state:
          enum: [new, learning, review, relearning]
        dueAt: &studyTime
          type: string
          format: date-time
        lastReviewAt: *studyTime
        reps: &studyCount
          type: integer
          minimum: 0
        lapses: *studyCount
        version: *studyCount
    StudyReviewResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [cardKey, progress, reviewedAt]
          properties:
            cardKey:
              $ref: '#/components/schemas/StudyCardKey'
            progress:
