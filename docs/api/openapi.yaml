        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Invitation Requests]
      operationId: cancelInvitationRequest
      summary: Requester hủy request đang chờ
      security:
        - sessionCookie: []
          csrfToken: []
        - guestCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Request đã được hủy
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
