          answers,
          score,
          submittedAt,
          results,
        ]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        deckVersionId:
          $ref: '#/components/schemas/ObjectId'
        sourceSessionId:
          $ref: '#/components/schemas/ObjectId'
        status:
          type: string
          enum: [submitted]
        total:
          type: integer
          minimum: 1
          maximum: 5
        version:
          type: integer
          minimum: 1
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuizQuestionPublic'
        answers:
          type: array
          items:
            $ref: '#/components/schemas/SubmitQuizAnswerItem'
        score:
          type: integer
          minimum: 0
          maximum: 5
        submittedAt:
          type: string
          format: date-time
        results:
          type: array
          items:
            $ref: '#/components/schemas/QuizResultItem'

    QuizResultResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/QuizResult'
        meta:
          $ref: '#/components/schemas/Meta'

    SubmitQuizAnswerItem:
      type: object
      additionalProperties: false
      required: [questionVersionId]
      properties:
        questionVersionId:
          $ref: '#/components/schemas/ObjectId'
        optionId:
          type: string
          maxLength: 64
        text:
          type: string
          maxLength: 500

    SubmitQuizRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, answers]
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        answers:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/SubmitQuizAnswerItem'

    QuizSummaryItem:
      type: object
      additionalProperties: false
      required: [id, deckVersionId, status, total, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        deckVersionId:
          $ref: '#/components/schemas/ObjectId'
        sourceSessionId:
          $ref: '#/components/schemas/ObjectId'
        status:
          type: string
          enum: [inProgress, submitted]
        total:
          type: integer
        score:
          type: integer
        createdAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time

    QuizListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, nextCursor]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/QuizSummaryItem'
            nextCursor:
              type: [string, 'null']
        meta:
          $ref: '#/components/schemas/Meta'

    BlockItem:
      type: object
      additionalProperties: false
      required: [id, partner, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        partner:
          $ref: '#/components/schemas/Partner'
        createdAt:
          type: string
          format: date-time

    BlockListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, nextCursor]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/BlockItem'
            nextCursor:
              type: [string, 'null']
        meta:
          $ref: '#/components/schemas/Meta'

    CreateBlockRequest:
      type: object
      additionalProperties: false
      required: [sessionId, targetActorKey]
      properties:
        sessionId:
          $ref: '#/components/schemas/ObjectId'
        targetActorKey:
          type: string
          pattern: '^(user|guest):[0-9a-f]{24}$'
          example: user:507f1f77bcf86cd799439012

    CreateBlockResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [id]
          properties:
            id:
              $ref: '#/components/schemas/ObjectId'
        meta:
          $ref: '#/components/schemas/Meta'

    CreateReportRequest:
      type: object
      additionalProperties: false
      required: [sessionId, targetActorKey, reason]
      properties:
        sessionId:
          $ref: '#/components/schemas/ObjectId'
        targetActorKey:
          type: string
          pattern: '^(user|guest):[0-9a-f]{24}$'
          example: user:507f1f77bcf86cd799439012
        reason:
          type: string
          minLength: 1
          maxLength: 500
          example: Ngôn từ không phù hợp trong phiên luyện
        description:
          type: string
          maxLength: 2000
          example: Đối tác sử dụng lời lẽ thiếu tôn trọng khi luyện tập.

    ReportCreated:
      type: object
      additionalProperties: false
      required: [id, status, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        status:
          type: string
          enum: [new, inProgress, resolved, rejected]
        createdAt:
          type: string
          format: date-time

    CreateReportResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ReportCreated'
        meta:
          $ref: '#/components/schemas/Meta'

    AdminStatisticsResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - registeredAccounts
            - startedSessions
            - reviewCount
            - submittedQuizCount
          properties:
            registeredAccounts:
              type: integer
              minimum: 0
            startedSessions:
              type: integer
              minimum: 0
            reviewCount:
              type: integer
              minimum: 0
            submittedQuizCount:
              type: integer
              minimum: 0
        meta:
          $ref: '#/components/schemas/Meta'

    AdminUser:
      type: object
      additionalProperties: false
      required: [id, email, displayName, status, version]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        email:
          type: string
          format: email
        displayName:
          type: string
        status:
          type: string
          enum: [active, locked]
        version:
          type: integer
          minimum: 0

    AdminUserListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, nextCursor]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminUser'
            nextCursor:
              type: [string, 'null']
        meta:
          $ref: '#/components/schemas/Meta'

    AdminUserStatusRequest:
      type: object
      additionalProperties: false
      required: [status, expectedVersion]
      properties:
        status:
          type: string
          enum: [active, locked]
        expectedVersion:
          type: integer
          minimum: 0

    AdminUserStatusResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [id, status, version]
          properties:
            id:
              $ref: '#/components/schemas/ObjectId'
            status:
              type: string
              enum: [active, locked]
            version:
              type: integer
              minimum: 0
        meta:
          $ref: '#/components/schemas/Meta'

    ReportStatus:
      type: string
      enum: [new, inProgress, resolved, rejected]

    Report:
      type: object
      additionalProperties: false
      required:
        - id
        - reporterKey
        - reportedKey
        - sessionId
        - reason
        - status
        - version
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        reporterKey:
          type: string
        reportedKey:
          type: string
        sessionId:
          $ref: '#/components/schemas/ObjectId'
        reason:
          type: string
          minLength: 1
        description:
          type: string
          maxLength: 2000
        status:
          $ref: '#/components/schemas/ReportStatus'
        resolution:
          type: string
          maxLength: 2000
        handledBy:
          $ref: '#/components/schemas/ObjectId'
        handledAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time

    ReportResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Report'
        meta:
          $ref: '#/components/schemas/Meta'

    ReportListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, nextCursor]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Report'
            nextCursor:
              type: [string, 'null']
        meta:
          $ref: '#/components/schemas/Meta'

    ReportUpdateRequest:
      type: object
      additionalProperties: false
      required: [status, expectedVersion]
      properties:
        status:
          $ref: '#/components/schemas/ReportStatus'
        expectedVersion:
          type: integer
          minimum: 0
        resolution:
          type: string
          minLength: 1
          maxLength: 2000

  responses:
    RequestError:
      description: L?i theo ErrorResponse v? API specification
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Thiếu hoặc không còn phiên xác thực hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không có quyền, sai CSRF/Origin hoặc tài khoản đã bị khóa (FORBIDDEN, CSRF_INVALID, ACCOUNT_LOCKED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Tài nguyên không tồn tại hoặc ngoài phạm vi truy cập
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: >-
        Xung đột trạng thái hoặc danh tính (`VERSION_CONFLICT`,
        `IDEMPOTENCY_CONFLICT`, `IDENTITY_CONFLICT`, `ACTOR_BUSY`,
        `INVITATION_UNAVAILABLE`, ...)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: Quyền truy cập tạm của khách đã hết hạn hoặc bị thu hồi (GUEST_EXPIRED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: Request không đạt validation contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ContentIncomplete:
      description: Học liệu thiếu references hoặc không đạt ngưỡng tối thiểu trước khi xuất bản (422)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Vượt giới hạn request; xem header Retry-After
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Dependency an toàn chưa sẵn sàng; không tạo session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
