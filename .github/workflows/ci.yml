name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every push scan covers its own commit range, so a later push must not cancel it.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.run_id || github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the pinned npm release
        run: |
          package_manager=$(node -p "require('./package.json').packageManager")
          npm install --global "$package_manager"
      - run: npm ci
      - run: npm run check

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the pinned npm release
        run: |
          package_manager=$(node -p "require('./package.json').packageManager")
          npm install --global "$package_manager"
      - run: npm ci
      - run: npm run audit:ci

  secret-scan:
    name: Secret scan
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select Git revisions to scan
        id: revisions
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git cat-file -e "${HEAD_SHA:?}^{commit}"
          revisions="$HEAD_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git cat-file -e "${BASE_SHA:?}^{commit}"
            revisions="$BASE_SHA..$HEAD_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            revisions="$BASE_SHA..$HEAD_SHA"
          fi
          printf 'range=%s\n' "$revisions" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/scan-secrets
        with:
          revisions: ${{ steps.revisions.outputs.range }}
